<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DisputeDesk policies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;600;700&display=optional">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="narrow">
    <header class="page-hero">
      <p class="eyebrow" id="policies-eyebrow">Policies</p>
      <h1>Dispute policies</h1>
      <p class="lede">These rules shape every recommendation. The agent reads the text under each rule and has to
        cite the rule it relies on, so you can see exactly why it chose to defend or accept.</p>
      <ul class="stat-chips" id="policies-stats" aria-label="Policy counts"></ul>
    </header>
    <p class="banner" id="error" role="alert" hidden></p>

    <form id="policies" novalidate>
      <p class="state" id="loading">Loading your policies.</p>
    </form>
    <section id="autopilot-settings" class="autopilot-slot" aria-label="Autopilot preview settings" hidden></section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/pointer.js"></script>
  <script src="/static/policies.js"></script>
</body>
</html>
