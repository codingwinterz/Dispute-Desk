<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DisputeDesk queue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;600;700&display=optional">
  <!-- AG Grid Community 32.3.3 (MIT license), free features only. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main>
    <header class="page-hero">
      <p class="eyebrow" id="queue-eyebrow">Queue</p>
      <h1 id="queue-title">Disputes waiting on you</h1>
      <p class="lede" id="summary">Loading disputes from the local store.</p>
      <ul class="stat-chips" id="queue-stats" aria-label="Queue figures"></ul>
    </header>
    <p class="banner" id="error" role="alert" hidden></p>

    <div class="toolbar" role="search">
      <label class="field">Search
        <input id="search" type="search" placeholder="Dispute ID, reason or amount" autocomplete="off">
      </label>
      <label class="field">Reason
        <select id="reason"><option value="">All reasons</option></select>
      </label>
      <div class="field">
        <span id="show-label">Show</span>
        <div class="segmented" role="group" aria-labelledby="show-label">
          <button type="button" data-status="WAITING_FOR_SELLER_RESPONSE" aria-pressed="false">Waiting on you <span class="seg-count" data-count="waiting"></span></button>
          <button type="button" data-status="UNDER_REVIEW" aria-pressed="false">With PayPal <span class="seg-count" data-count="withPayPal"></span></button>
          <button type="button" data-status="" aria-pressed="true">All <span class="seg-count" data-count="all"></span></button>
        </div>
      </div>
      <span class="count" id="count" aria-live="polite"></span>
    </div>

    <div id="autopilot-bar" class="autopilot-slot" hidden></div>
    <div id="grid" class="ag-theme-quartz-dark" aria-label="Dispute queue"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/pointer.js"></script>
  <script src="/static/queue.js"></script>
</body>
</html>
